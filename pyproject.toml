[project]
name = "metrorower"
version = "0.1.0"
description = "Eksport przejazdów Nextbike (Metrorower) do plików GPX"
readme = "README.md"
authors = [
    { name = "mgurg", email = "34517378+mgurg@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
metrorower = "metrorower.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "ty>=0.0.88",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
